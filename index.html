<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Murojaat yuborish</title>

    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>

<body>
    <div class="container">

        <div class="columns mt-6">
            <div class="column">
                <div class="box">
                    <p class="has-text-centered">
                        Assalomu alaykum. Siz bu sayt orqali
                        11-maktab direktori O. Bayliyevga murojaat
                        qilishingiz mumkin.
                    </p>

                    <p class="has-text-centered mt-2">
                        Murojaatingiz yuboriladi. Ammo to‘liq anonimlik
                        kafolatlanmaydi.
                    </p>
                </div>
            </div>
        </div>

        <div class="columns mt-2">
            <div class="column">
                <div class="box">

                    <form
                        id="myForm"
                        action="https://formspree.io/f/xwllqkvr"
                        method="POST"
                    >
                        <div class="field">
                            <label class="label" for="message">
                                Murojaatingiz
                            </label>

                            <div class="control">
                                <textarea
                                    name="message"
                                    id="message"
                                    placeholder="Murojaatingizni qoldiring"
                                    class="textarea"
                                    required
                                ></textarea>
                            </div>
                        </div>

                        <button
                            type="submit"
                            class="button is-fullwidth mt-4 is-success"
                        >
                            Yuborish
                        </button>

                        <div
                            id="messageStatus"
                            class="notification is-hidden mt-3"
                            role="status"
                            aria-live="polite"
                        ></div>
                    </form>

                </div>
            </div>
        </div>

        <div class="box has-text-centered" style="margin-top: 250px;">
            © 2026 Shanur Karimov. Barcha huquqlar himoyalangan.
        </div>

    </div>

    <script>
        const form = document.getElementById("myForm");
        const messageStatus = document.getElementById("messageStatus");
        const submitButton = form.querySelector('button[type="submit"]');

        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            submitButton.disabled = true;
            submitButton.textContent = "Yuborilmoqda...";

            messageStatus.classList.add("is-hidden");
            messageStatus.textContent = "";

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    body: new FormData(form),
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (!response.ok) {
                    throw new Error("Xabar yuborilmadi");
                }

                alert("✅ Murojaatingiz muvaffaqiyatli yuborildi!");

                form.reset();

            } catch (error) {
                messageStatus.className =
                    "notification is-danger mt-3";
                messageStatus.textContent =
                    "Xatolik yuz berdi. Internet va Formspree sozlamalarini tekshiring.";
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Yuborish";
            }
        });
    </script>
</body>
</html>
